<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project 1: Time Series & Category Charts</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 40px auto; padding: 20px; line-height: 1.6; background-color: #f8f9fa; }
        .chart-card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 30px; text-align: center; }
        img { max-width: 100%; height: auto; border-radius: 6px; }
        h1, h2 { color: #333; }
    </style>
</head>
<body>
    <h1>Time Series & Category Charts Analysis</h1>
    <p>SyntecxHub Project 1 — Visualizing sales patterns, categorical distribution, and market share.</p>

    <div class="chart-card">
        <h2>1. Monthly Sales Trend (Time Series)</h2>
        <img src="monthly_sales_trend.png" alt="Monthly Sales Trend">
    </div>

    <div class="chart-card">
        <h2>2. Category Comparison (Bar Chart)</h2>
        <img src="category_sales_bar.png" alt="Category Sales Bar Chart">
    </div>

    <div class="chart-card">
        <h2>3. Sales Share by Category (Pie Chart)</h2>
        <img src="category_share_pie.png" alt="Category Share Pie Chart">
    </div>
</body>
</html>
